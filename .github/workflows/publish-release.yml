name: Publish Release

# Triggered manually or by a repository_dispatch from conte-cli.
# Downloads private release artifacts using CONTE_CLI_TOKEN (CI secret only),
# then republishes them as public assets on this repository.
# CONTE_CLI_TOKEN is never exposed in scripts, logs, docs, or README examples.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      conte_cli_version:
        description: 'Source Conte CLI release version (defaults to version)'
        required: false
        type: string
  repository_dispatch:
    types: [publish-release]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          DISPATCH_CONTE_CLI_VERSION: ${{ github.event.client_payload.conte_cli_version }}
          DISPATCH_PRERELEASE: ${{ github.event.client_payload.prerelease || 'false' }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CONTE_CLI_VERSION: ${{ github.event.inputs.conte_cli_version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            VERSION="${DISPATCH_VERSION:-}"
            CONTE_CLI_VERSION="${DISPATCH_CONTE_CLI_VERSION:-${DISPATCH_VERSION:-}}"
            PRERELEASE="${DISPATCH_PRERELEASE:-false}"
          else
            VERSION="${INPUT_VERSION:-}"
            CONTE_CLI_VERSION="${INPUT_CONTE_CLI_VERSION:-${INPUT_VERSION:-}}"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          fi

          VERSION="$(printf '%s' "$VERSION" | tr -d '\r\n\t ')"
          CONTE_CLI_VERSION="$(printf '%s' "$CONTE_CLI_VERSION" | tr -d '\r\n\t ')"

          if [ -z "$VERSION" ]; then
            echo "Missing release version."
            exit 1
          fi

          if [ -z "$CONTE_CLI_VERSION" ]; then
            echo "Missing source CLI version. Set conte_cli_version or version."
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version: '$VERSION'. Expected vX.Y.Z."
            exit 1
          fi

          if ! printf '%s' "$CONTE_CLI_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid source CLI release version: '$CONTE_CLI_VERSION'. Expected vX.Y.Z."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "conte_cli_version=$CONTE_CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts from conte-cli
        env:
          CONTE_CLI_TOKEN: ${{ secrets.CONTE_CLI_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          CONTE_CLI_VERSION: ${{ steps.ver.outputs.conte_cli_version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          SOURCE_REPO="conte-martin/conte-cli"
          SOURCE_VERSION="${CONTE_CLI_VERSION:-${VERSION:-}}"

          if [ -z "${CONTE_CLI_TOKEN:-}" ]; then
            echo "Missing required secret: CONTE_CLI_TOKEN"
            exit 1
          fi

          if [ -z "$SOURCE_VERSION" ]; then
            echo "Missing source CLI version. Set CONTE_CLI_VERSION or VERSION."
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "Missing required dependency: jq"
            exit 1
          fi

          echo "Checking access to source repository: $SOURCE_REPO"
          REPO_STATUS="$(curl -sS -o /tmp/source-repo.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CONTE_CLI_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SOURCE_REPO")"

          if [ "$REPO_STATUS" != "200" ]; then
            echo "Unable to access source repository: $SOURCE_REPO"
            echo "HTTP status: $REPO_STATUS"
            if [ "$REPO_STATUS" = "401" ] || [ "$REPO_STATUS" = "403" ] || [ "$REPO_STATUS" = "404" ]; then
              echo "Check that CONTE_CLI_TOKEN has access to the private source repository."
              echo "For fine-grained PATs, grant repository access plus read permissions for contents and metadata."
            fi
            echo "Sanitized API response:"
            jq -r '.message? // empty' /tmp/source-repo.json 2>/dev/null || true
            exit 1
          fi

          echo "Fetching source release metadata: $SOURCE_REPO@$SOURCE_VERSION"
          RELEASE_STATUS="$(curl -sS -o /tmp/source-release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CONTE_CLI_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SOURCE_REPO/releases/tags/$SOURCE_VERSION")"

          if [ "$RELEASE_STATUS" != "200" ]; then
            echo "Unable to fetch source release metadata."
            echo "Source repository: $SOURCE_REPO"
            echo "Source release tag: $SOURCE_VERSION"
            echo "HTTP status: $RELEASE_STATUS"

            if [ "$RELEASE_STATUS" = "404" ]; then
              echo "Possible causes:"
              echo "- The release tag was not found in $SOURCE_REPO."
              echo "- CONTE_CLI_TOKEN lacks access to the private source repository."
              echo "- The source repository has a Git tag but not a published GitHub Release for this tag."
              echo "Check that $SOURCE_REPO has a published GitHub Release for tag $SOURCE_VERSION."
            elif [ "$RELEASE_STATUS" = "401" ] || [ "$RELEASE_STATUS" = "403" ]; then
              echo "Token permission error. Check CONTE_CLI_TOKEN permissions."
            fi

            echo "Sanitized API response:"
            jq -r '.message? // empty' /tmp/source-release.json 2>/dev/null || true
            exit 1
          fi

          RELEASE_JSON="$(cat /tmp/source-release.json)"

          ASSETS=(
            "conte-cli-linux-x64.tar.gz"
            "conte-cli-linux-arm64.tar.gz"
            "conte-cli-macos-x64.tar.gz"
            "conte-cli-macos-arm64.tar.gz"
            "conte-cli-windows-x64.zip"
            "conte-cli-installer-windows-x64.exe"
          )

          for ASSET in "${ASSETS[@]}"; do
            ASSET_ID="$(printf '%s' "$RELEASE_JSON" \
              | jq -r ".assets[] | select(.name == \"$ASSET\") | .id")"

            if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
              echo "Missing required asset in source release."
              echo "Source repository: $SOURCE_REPO"
              echo "Source release tag: $SOURCE_VERSION"
              echo "Missing asset: $ASSET"
              echo "Available assets:"
              printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name'
              exit 1
            fi

            echo "Downloading $ASSET (id=$ASSET_ID)..."
            curl -fsSL \
              -H "Authorization: Bearer ${CONTE_CLI_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$SOURCE_REPO/releases/assets/$ASSET_ID" \
              -o "release-artifacts/$ASSET"
          done

          for ASSET in "${ASSETS[@]}"; do
            if [ ! -s "release-artifacts/$ASSET" ]; then
              echo "Downloaded artifact is missing or empty: $ASSET"
              exit 1
            fi
          done

      - name: Generate checksums.txt
        run: |
          cd release-artifacts
          sha256sum \
            conte-cli-linux-x64.tar.gz \
            conte-cli-linux-arm64.tar.gz \
            conte-cli-macos-x64.tar.gz \
            conte-cli-macos-arm64.tar.gz \
            conte-cli-windows-x64.zip \
            conte-cli-installer-windows-x64.exe \
            > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Generate latest.json
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          BASE="https://github.com/conte-martin/conte-cli-installer/releases/download/$VERSION"
          cat > release-artifacts/latest.json <<EOF
          {
            "version": "$VERSION",
            "linux_x64_url": "$BASE/conte-cli-linux-x64.tar.gz",
            "linux_arm64_url": "$BASE/conte-cli-linux-arm64.tar.gz",
            "macos_x64_url": "$BASE/conte-cli-macos-x64.tar.gz",
            "macos_arm64_url": "$BASE/conte-cli-macos-arm64.tar.gz",
            "windows_x64_url": "$BASE/conte-cli-windows-x64.zip",
            "windows_installer_x64_url": "$BASE/conte-cli-installer-windows-x64.exe",
            "checksums_url": "$BASE/checksums.txt"
          }
          EOF
          echo "--- latest.json ---"
          cat release-artifacts/latest.json
          jq empty release-artifacts/latest.json

      - name: Validate installer scripts
        run: |
          set -euo pipefail
          for SCRIPT in install.sh install.ps1 install.cmd; do
            if [ ! -f "$SCRIPT" ]; then
              echo "Missing installer script: $SCRIPT"
              exit 1
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Conte CLI ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          body: |
            ## Installation

            **Linux / macOS**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/conte-martin/conte-cli-installer/main/install.sh | bash
            ```

            **Windows PowerShell**
            ```powershell
            irm https://raw.githubusercontent.com/conte-martin/conte-cli-installer/main/install.ps1 | iex
            ```

            **Windows CMD**
            ```cmd
            curl -fsSL https://raw.githubusercontent.com/conte-martin/conte-cli-installer/main/install.cmd -o install.cmd && install.cmd && del install.cmd
            ```

            See [README](https://github.com/conte-martin/conte-cli-installer#readme) for full installation instructions.
          files: |
            release-artifacts/conte-cli-linux-x64.tar.gz
            release-artifacts/conte-cli-linux-arm64.tar.gz
            release-artifacts/conte-cli-macos-x64.tar.gz
            release-artifacts/conte-cli-macos-arm64.tar.gz
            release-artifacts/conte-cli-windows-x64.zip
            release-artifacts/conte-cli-installer-windows-x64.exe
            release-artifacts/checksums.txt
            release-artifacts/latest.json
            install.sh
            install.ps1
            install.cmd
          fail_on_unmatched_files: true
